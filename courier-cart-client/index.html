<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link rel="icon" type="image/svg+xml" href="/feather-global-mark.svg" />
    <link rel="apple-touch-icon" href="/feather-global-logo.svg" />
    <meta name="theme-color" content="#047b85" />

    <!-- SEO Meta -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="title" content="Feather Global - Logistics Workspace" />
    <meta
      name="description"
      content="Manage shipping, tracking, COD, and logistics operations with Feather Global."
    />
    <meta
      name="keywords"
      content="xpress delivery, shipping, logistics, courier, tracking, ecommerce shipping, fast delivery"
    />

    <!-- Social Preview -->
    <meta property="og:title" content="Feather Global - Logistics Workspace" />
    <meta
      property="og:description"
      content="Reliable delivery workflows, cleaner visibility, and smarter shipping decisions."
    />
    <meta property="og:image" content="/feather-global-logo.svg" />
    <meta property="og:type" content="website" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <title>Feather Global</title>
    <script>
      ;(() => {
        const markerKey = 'fg_shopify_app_client'
        const params = new URLSearchParams(window.location.search)
        const isNewAppEntry =
          window.location.pathname.startsWith('/shopify/install') ||
          params.get('fg_shopify_app') === 'new'

        if (isNewAppEntry) sessionStorage.setItem(markerKey, 'new')
        const useNewApp = isNewAppEntry || sessionStorage.getItem(markerKey) === 'new'
        if (useNewApp && sessionStorage.getItem('fg_public_shopify_app') === '1') {
          document.documentElement.dataset.shopifyApp = 'public'
        }
        const meta = document.createElement('meta')
        meta.name = 'shopify-api-key'
        meta.content = useNewApp
          ? 'a64a918b0ecfc48d7f2402def3b8c92a'
          : '2d51ab15c8b649b6cfe0cafc9592ee69'
        document.head.appendChild(meta)
      })()
    </script>
    <script src="https://cdn.shopify.com/shopifycloud/app-bridge.js"></script>
    <!-- Razorpay Checkout -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
