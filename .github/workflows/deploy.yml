name: Deploy Feathers Global

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      FEATHERS_HOST: ${{ secrets.FEATHERS_HOST || '72.62.247.178' }}
      FEATHERS_USER: ${{ secrets.FEATHERS_USER || 'root' }}
      FEATHERS_SSH_PORT: ${{ secrets.FEATHERS_SSH_PORT || '22' }}
      FEATHERS_DEPLOY_ROOT: ${{ vars.FEATHERS_DEPLOY_ROOT || '/srv/feathers-global/current' }}
      FEATHERS_SSH_PASSWORD: ${{ secrets.FEATHERS_SSH_PASSWORD }}
      FEATHERS_SSH_PRIVATE_KEY: ${{ secrets.FEATHERS_SSH_PRIVATE_KEY }}
      FEATHERS_LANDING_PORT: ${{ vars.FEATHERS_LANDING_PORT || '8088' }}
      FEATHERS_APP_PORT: ${{ vars.FEATHERS_APP_PORT || '8089' }}
      FEATHERS_ADMIN_PORT: ${{ vars.FEATHERS_ADMIN_PORT || '8090' }}
      FEATHERS_API_PORT: ${{ vars.FEATHERS_API_PORT || '8092' }}
      FEATHERS_BACKEND_PORT: ${{ vars.FEATHERS_BACKEND_PORT || '5013' }}
      FEATHERS_DB_PORT: ${{ vars.FEATHERS_DB_PORT || '5432' }}
      FEATHERS_PGADMIN_PORT: ${{ vars.FEATHERS_PGADMIN_PORT || '5051' }}
      FEATHERS_PGADMIN_PUBLIC_PORT: ${{ vars.FEATHERS_PGADMIN_PUBLIC_PORT || '8093' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -p "$FEATHERS_SSH_PORT" -H "$FEATHERS_HOST" >> ~/.ssh/known_hosts

          if [ -n "$FEATHERS_SSH_PRIVATE_KEY" ]; then
            printf '%s\n' "$FEATHERS_SSH_PRIVATE_KEY" > ~/.ssh/feathers_global_deploy_key
            chmod 600 ~/.ssh/feathers_global_deploy_key
            echo "SSH_CMD=ssh -i $HOME/.ssh/feathers_global_deploy_key -p $FEATHERS_SSH_PORT -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" >> "$GITHUB_ENV"
            echo "SSH_RSH=ssh -i $HOME/.ssh/feathers_global_deploy_key -p $FEATHERS_SSH_PORT -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" >> "$GITHUB_ENV"
          elif [ -n "$FEATHERS_SSH_PASSWORD" ]; then
            sudo apt-get update
            sudo apt-get install -y sshpass
            echo "SSH_CMD=sshpass -e ssh -p $FEATHERS_SSH_PORT -o StrictHostKeyChecking=yes" >> "$GITHUB_ENV"
            echo "SSH_RSH=sshpass -e ssh -p $FEATHERS_SSH_PORT -o StrictHostKeyChecking=yes" >> "$GITHUB_ENV"
          else
            echo "Set FEATHERS_SSH_PRIVATE_KEY or FEATHERS_SSH_PASSWORD in GitHub secrets." >&2
            exit 1
          fi

      - name: Mark isolated deploy root
        run: |
          set -euo pipefail
          export SSHPASS="$FEATHERS_SSH_PASSWORD"
          $SSH_CMD "$FEATHERS_USER@$FEATHERS_HOST" \
            "DEPLOY_ROOT='$FEATHERS_DEPLOY_ROOT'; \
             mkdir -p \"\$DEPLOY_ROOT\"; \
             if [ -z \"\$(find \"\$DEPLOY_ROOT\" -mindepth 1 -maxdepth 1 ! -name '.deploy-env' ! -name '.feathers-global-deploy' -print -quit 2>/dev/null)\" ]; then \
               touch \"\$DEPLOY_ROOT/.feathers-global-deploy\"; \
             elif [ ! -f \"\$DEPLOY_ROOT/.feathers-global-deploy\" ]; then \
               echo \"Refusing to deploy: \$DEPLOY_ROOT is not marked for Feathers Global\" >&2; exit 1; \
             fi; \
             if command -v apt-get >/dev/null 2>&1 && ! command -v rsync >/dev/null 2>&1; then apt-get update && apt-get install -y rsync; fi"

      - name: Sync project
        run: |
          set -euo pipefail
          export SSHPASS="$FEATHERS_SSH_PASSWORD"
          rsync -az --delete \
            -e "$SSH_RSH" \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.DS_Store' \
            --exclude 'backend/.env.production' \
            --exclude '.deploy-env' \
            --exclude 'backend/node_modules' \
            --exclude 'landing/node_modules' \
            --exclude 'courier-cart-client/node_modules' \
            --exclude 'admin-dashboard/node_modules' \
            --exclude 'backend/dist' \
            --exclude 'landing/dist' \
            --exclude 'courier-cart-client/dist' \
            --exclude 'admin-dashboard/build' \
            ./ "$FEATHERS_USER@$FEATHERS_HOST:$FEATHERS_DEPLOY_ROOT/"

      - name: Setup and release on VPS
        run: |
          set -euo pipefail
          export SSHPASS="$FEATHERS_SSH_PASSWORD"
          $SSH_CMD "$FEATHERS_USER@$FEATHERS_HOST" \
            "cd '$FEATHERS_DEPLOY_ROOT' && \
             chmod +x deploy/setup-vps.sh deploy/release.sh && \
             FEATHERS_DEPLOY_ROOT='$FEATHERS_DEPLOY_ROOT' \
             FEATHERS_LANDING_PORT='$FEATHERS_LANDING_PORT' \
             FEATHERS_APP_PORT='$FEATHERS_APP_PORT' \
             FEATHERS_ADMIN_PORT='$FEATHERS_ADMIN_PORT' \
             FEATHERS_API_PORT='$FEATHERS_API_PORT' \
             FEATHERS_BACKEND_PORT='$FEATHERS_BACKEND_PORT' \
             FEATHERS_DB_PORT='$FEATHERS_DB_PORT' \
             FEATHERS_PGADMIN_PORT='$FEATHERS_PGADMIN_PORT' \
             FEATHERS_PGADMIN_PUBLIC_PORT='$FEATHERS_PGADMIN_PUBLIC_PORT' \
             ./deploy/setup-vps.sh && \
             ./deploy/release.sh"

      - name: Print deployed URLs
        run: |
          echo "Landing: http://${FEATHERS_HOST}:${FEATHERS_LANDING_PORT}/"
          echo "App: http://${FEATHERS_HOST}:${FEATHERS_APP_PORT}/"
          echo "Admin: http://${FEATHERS_HOST}:${FEATHERS_ADMIN_PORT}/"
          echo "API health: http://${FEATHERS_HOST}:${FEATHERS_API_PORT}/api/health"
          echo "pgAdmin: http://${FEATHERS_HOST}:${FEATHERS_PGADMIN_PUBLIC_PORT}/"
