name: Deploy Feathers Global

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      FEATHERS_HOST: ${{ secrets.FEATHERS_HOST || '187.127.142.15' }}
      FEATHERS_USER: ${{ secrets.FEATHERS_USER || 'root' }}
      FEATHERS_SSH_PORT: ${{ secrets.FEATHERS_SSH_PORT || '22' }}
      FEATHERS_DEPLOY_ROOT: ${{ vars.FEATHERS_DEPLOY_ROOT || '/srv/shiplifi/current' }}
      FEATHERS_ADMIN_API_BASE_URL: ${{ vars.FEATHERS_ADMIN_API_BASE_URL || 'https://api.shiplifi.com/api' }}
      FEATHERS_ADMIN_SOCKET_URL: ${{ vars.FEATHERS_ADMIN_SOCKET_URL || 'https://api.shiplifi.com' }}
      FEATHERS_SSH_PASSWORD: ${{ secrets.FEATHERS_SSH_PASSWORD }}
      FEATHERS_SSH_PRIVATE_KEY: ${{ secrets.FEATHERS_SSH_PRIVATE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -T 20 -p "$FEATHERS_SSH_PORT" -H "$FEATHERS_HOST" >> ~/.ssh/known_hosts || true

          if [ -n "$FEATHERS_SSH_PRIVATE_KEY" ]; then
            printf '%s\n' "$FEATHERS_SSH_PRIVATE_KEY" > ~/.ssh/feathers_global_deploy_key
            chmod 600 ~/.ssh/feathers_global_deploy_key
            echo "SSH_CMD=ssh -i $HOME/.ssh/feathers_global_deploy_key -p $FEATHERS_SSH_PORT -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" >> "$GITHUB_ENV"
            echo "SSH_RSH=ssh -i $HOME/.ssh/feathers_global_deploy_key -p $FEATHERS_SSH_PORT -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" >> "$GITHUB_ENV"
          elif [ -n "$FEATHERS_SSH_PASSWORD" ]; then
            sudo apt-get update
            sudo apt-get install -y sshpass
            echo "SSH_CMD=sshpass -e ssh -p $FEATHERS_SSH_PORT -o StrictHostKeyChecking=accept-new" >> "$GITHUB_ENV"
            echo "SSH_RSH=sshpass -e ssh -p $FEATHERS_SSH_PORT -o StrictHostKeyChecking=accept-new" >> "$GITHUB_ENV"
          else
            echo "Set FEATHERS_SSH_PRIVATE_KEY or FEATHERS_SSH_PASSWORD in GitHub secrets." >&2
            exit 1
          fi

      - name: Mark isolated deploy root
        run: |
          set -euo pipefail
          export SSHPASS="$FEATHERS_SSH_PASSWORD"
          $SSH_CMD "$FEATHERS_USER@$FEATHERS_HOST" \
            "DEPLOY_ROOT='$FEATHERS_DEPLOY_ROOT'; \
             mkdir -p \"\$DEPLOY_ROOT\"; \
             touch \"\$DEPLOY_ROOT/.feathers-global-deploy\"; \
             test -f \"\$DEPLOY_ROOT/admin-dashboard/package.json\"; \
             test -f \"\$DEPLOY_ROOT/backend/package.json\"; \
             test -f \"\$DEPLOY_ROOT/courier-cart-client/package.json\"; \
             command -v rsync >/dev/null"

      - name: Sync project
        run: |
          set -euo pipefail
          export SSHPASS="$FEATHERS_SSH_PASSWORD"
          rsync -az --delete \
            -e "$SSH_RSH" \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.DS_Store' \
            --exclude 'backend/.env.production' \
            --exclude '.deploy-env' \
            --exclude '.deployed_commit' \
            --exclude '.feathers-global-deploy' \
            --exclude 'backend/node_modules' \
            --exclude 'landing/node_modules' \
            --exclude 'courier-cart-client/node_modules' \
            --exclude 'admin-dashboard/node_modules' \
            --exclude 'backend/dist' \
            --exclude 'landing/dist' \
            --exclude 'courier-cart-client/dist' \
            --exclude 'admin-dashboard/build' \
            ./ "$FEATHERS_USER@$FEATHERS_HOST:$FEATHERS_DEPLOY_ROOT/"

      - name: Build and release admin on VPS
        run: |
          set -euo pipefail
          export SSHPASS="$FEATHERS_SSH_PASSWORD"
          $SSH_CMD "$FEATHERS_USER@$FEATHERS_HOST" \
            "cd '$FEATHERS_DEPLOY_ROOT' && \
             printf '%s\n' 'REACT_APP_API_BASE_URL=$FEATHERS_ADMIN_API_BASE_URL' 'REACT_APP_SOCKET_URL=$FEATHERS_ADMIN_SOCKET_URL' 'PUBLIC_URL=/' > admin-dashboard/.env.production && \
             cp admin-dashboard/.env.production admin-dashboard/.env && \
             cp admin-dashboard/.env.production admin-dashboard/.env.local && \
             cd admin-dashboard && \
             if [ -f package-lock.json ]; then npm ci --legacy-peer-deps --force; else npm install --legacy-peer-deps --force; fi && \
             npm run build && \
             latest_admin_js=\$(find build/static/js -maxdepth 1 -type f -name 'main.*.js' ! -name '*.LICENSE.txt' | sort | tail -n 1) && \
             latest_admin_css=\$(find build/static/css -maxdepth 1 -type f -name 'main.*.css' | sort | tail -n 1) && \
             if [ -n \"\$latest_admin_js\" ]; then ln -sf \"\$(basename \"\$latest_admin_js\")\" build/static/js/main.latest.js; fi && \
             if [ -n \"\$latest_admin_css\" ]; then ln -sf \"\$(basename \"\$latest_admin_css\")\" build/static/css/main.latest.css; fi && \
             find build/static/js -maxdepth 1 -type f -name '*.chunk.js' | while read -r chunk_file; do chunk_name=\$(basename \"\$chunk_file\"); chunk_id=\${chunk_name%%.*}; case \"\$chunk_id\" in ''|*[!0-9]*) continue ;; esac; ln -sf \"\$chunk_name\" \"build/static/js/\${chunk_id}.latest.chunk.js\"; done && \
             find build/static/css -maxdepth 1 -type f -name '*.chunk.css' | while read -r chunk_file; do chunk_name=\$(basename \"\$chunk_file\"); chunk_id=\${chunk_name%%.*}; case \"\$chunk_id\" in ''|*[!0-9]*) continue ;; esac; ln -sf \"\$chunk_name\" \"build/static/css/\${chunk_id}.latest.chunk.css\"; done && \
             cd .. && \
             printf '%s\n' '${{ github.sha }}' > .deployed_commit && \
             nginx -t && \
             systemctl reload nginx"

      - name: Print deployed URLs
        run: |
          echo "Admin: https://admin.shiplifi.com/"
          echo "API: https://api.shiplifi.com/"
